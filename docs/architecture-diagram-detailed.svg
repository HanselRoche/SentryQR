<svg xmlns="http://www.w3.org/2000/svg" width="2400" height="1736" viewBox="0 0 2400 1736" font-family="DejaVu Sans, Liberation Sans, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#5b6672"/>
    </marker>
    <marker id="arrowOpt" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#c9772a"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="2400" height="1736" fill="#f7f8fa"/>

  <!-- ===== Title ===== -->
  <text x="60" y="70" font-size="44" font-weight="bold" fill="#1f2933">SentryQR — System Architecture</text>
  <text x="60" y="106" font-size="21" fill="#5b6672">Dynamic QR hostel entry · ECDSA P-256 challenge–response · Node.js 22 + Express 4 + SQLite · React 18 SPA · CNS PBL 22CSE71</text>

  <!-- ===== TIER 1: CLIENTS ===== -->
  <text x="60" y="152" font-size="18" font-weight="bold" fill="#8b95a1" letter-spacing="2">CLIENT TIER — browsers · role-gated SPA routes · zero verification authority</text>

  <!-- Student card -->
  <rect x="60" y="170" width="700" height="300" rx="14" fill="#e8f0fe" stroke="#3b6fd4" stroke-width="2.5"/>
  <text x="86" y="212" font-size="26" font-weight="bold" fill="#1f2933">Student device — browser</text>
  <text x="86" y="240" font-size="19" fill="#5b6672">React SPA · /student · /student/history</text>
  <line x1="86" y1="256" x2="734" y2="256" stroke="#3b6fd4" stroke-width="1" opacity="0.4"/>
  <text x="86" y="290" font-size="20" fill="#1f2933">• WebCrypto ECDSA P-256 keypair, extractable = false</text>
  <text x="86" y="324" font-size="20" fill="#1f2933">• IndexedDB keystore — private key never leaves device</text>
  <text x="86" y="358" font-size="20" fill="#1f2933">• signs canonical message  v1|sid|nonce|iat</text>
  <text x="86" y="392" font-size="20" fill="#1f2933">• renders dynamic QR (qrcode), auto-refresh every 30 s</text>
  <text x="86" y="426" font-size="20" fill="#1f2933">• entry history from GET /api/students/me/entries</text>
  <text x="86" y="456" font-size="18" font-style="italic" fill="#3b6fd4">lib/keystore.js · lib/webcrypto.js · StudentHome.jsx</text>

  <!-- Guard card -->
  <rect x="960" y="170" width="620" height="300" rx="14" fill="#e8f0fe" stroke="#3b6fd4" stroke-width="2.5"/>
  <text x="986" y="212" font-size="26" font-weight="bold" fill="#1f2933">Guard device — browser</text>
  <text x="986" y="240" font-size="19" fill="#5b6672">React SPA · /guard · /guard/override</text>
  <line x1="986" y1="256" x2="1554" y2="256" stroke="#3b6fd4" stroke-width="1" opacity="0.4"/>
  <text x="986" y="290" font-size="20" fill="#1f2933">• html5-qrcode camera scanner</text>
  <text x="986" y="324" font-size="20" fill="#1f2933">• decodes QR, posts payload verbatim</text>
  <text x="986" y="358" font-size="20" fill="#1f2933">• shows GRANT / DENY + reason code</text>
  <text x="986" y="392" font-size="20" fill="#1f2933">• raises manual override requests</text>
  <text x="986" y="426" font-size="20" font-weight="bold" fill="#b3261e">• verifies nothing itself</text>
  <text x="986" y="456" font-size="18" font-style="italic" fill="#3b6fd4">GuardScanner.jsx · GuardOverride.jsx</text>

  <!-- Admin card -->
  <rect x="1640" y="170" width="700" height="300" rx="14" fill="#e8f0fe" stroke="#3b6fd4" stroke-width="2.5"/>
  <text x="1666" y="212" font-size="26" font-weight="bold" fill="#1f2933">Admin device — browser</text>
  <text x="1666" y="240" font-size="19" fill="#5b6672">React SPA · /admin · /keys · /overrides · /audit</text>
  <line x1="1666" y1="256" x2="2314" y2="256" stroke="#3b6fd4" stroke-width="1" opacity="0.4"/>
  <text x="1666" y="290" font-size="20" fill="#1f2933">• enrol students &amp; guards, activate / deactivate</text>
  <text x="1666" y="324" font-size="20" fill="#1f2933">• public-key console: register, list, revoke</text>
  <text x="1666" y="358" font-size="20" fill="#1f2933">• approve or deny guard override requests</text>
  <text x="1666" y="392" font-size="20" fill="#1f2933">• audit log viewer + entry statistics (recharts)</text>
  <text x="1666" y="426" font-size="20" fill="#1f2933">• acts as the simulated certificate authority</text>
  <text x="1666" y="456" font-size="18" font-style="italic" fill="#3b6fd4">AdminStudents · AdminKeys · AdminOverrides · AdminAudit</text>

  <!-- optical channel -->
  <polyline points="500,470 500,512 1180,512 1180,470" fill="none" stroke="#c9772a" stroke-width="3" stroke-dasharray="11 9" marker-end="url(#arrowOpt)"/>
  <text x="840" y="546" font-size="20" font-weight="bold" fill="#c9772a" text-anchor="middle">optical air gap — camera reads the screen</text>
  <text x="840" y="572" font-size="19" fill="#c9772a" text-anchor="middle">no network path between the two devices</text>

  <!-- client to transport arrows -->
  <line x1="180" y1="470" x2="180" y2="626" stroke="#5b6672" stroke-width="3" marker-end="url(#arrow)" marker-start="url(#arrow)"/>
  <text x="198" y="546" font-size="19" fill="#3f4a56">POST /api/challenge</text>
  <text x="198" y="572" font-size="19" fill="#3f4a56">POST /api/students/keys</text>

  <line x1="1400" y1="470" x2="1400" y2="626" stroke="#5b6672" stroke-width="3" marker-end="url(#arrow)" marker-start="url(#arrow)"/>
  <text x="1418" y="546" font-size="19" fill="#3f4a56">POST /api/verify</text>
  <text x="1418" y="572" font-size="19" fill="#3f4a56">POST /api/overrides</text>

  <line x1="1990" y1="470" x2="1990" y2="626" stroke="#5b6672" stroke-width="3" marker-end="url(#arrow)" marker-start="url(#arrow)"/>
  <text x="2008" y="546" font-size="19" fill="#3f4a56">GET / POST /api/admin/*</text>
  <text x="2008" y="572" font-size="19" fill="#3f4a56">POST /api/auth/login</text>

  <!-- ===== TRANSPORT BAND ===== -->
  <rect x="60" y="628" width="2280" height="64" rx="10" fill="#eceff3" stroke="#8b95a1" stroke-width="2" stroke-dasharray="6 5"/>
  <text x="1200" y="668" font-size="21" fill="#3f4a56" text-anchor="middle">TRANSPORT — HTTP on localhost in dev, HTTPS / TLS with the Secure cookie flag from Phase 6 · session cookie <tspan font-weight="bold">sentryqr_sid</tspan> (HttpOnly, SameSite=Lax, 8 h) · each client holds its own connection to the server</text>

  <!-- ===== TIER 2: SERVER ===== -->
  <text x="60" y="726" font-size="18" font-weight="bold" fill="#8b95a1" letter-spacing="2">APPLICATION TIER — the only component that decides anything</text>
  <rect x="60" y="740" width="2280" height="562" rx="14" fill="#eef7ee" stroke="#2e7d4f" stroke-width="2.5"/>
  <text x="90" y="784" font-size="27" font-weight="bold" fill="#1f2933">Express 4 API server (Node.js 22) — sole authority on GRANT / DENY</text>
  <text x="90" y="812" font-size="19" fill="#5b6672">src/app.js · security headers (nosniff, DENY frames, no-referrer) · 32 kb JSON body cap · x-powered-by disabled · trust proxy</text>

  <!-- request lifecycle pipeline -->
  <text x="90" y="846" font-size="17" font-weight="bold" fill="#2e7d4f" letter-spacing="1.5">REQUEST LIFECYCLE — every request, in this order</text>
  <rect x="90" y="856" width="333" height="54" rx="9" fill="#ffffff" stroke="#2e7d4f" stroke-width="2"/>
  <text x="256" y="890" font-size="20" fill="#1f2933" text-anchor="middle">rate limiter</text>
  <rect x="467" y="856" width="333" height="54" rx="9" fill="#ffffff" stroke="#2e7d4f" stroke-width="2"/>
  <text x="633" y="890" font-size="20" fill="#1f2933" text-anchor="middle">session cookie → req.user</text>
  <rect x="844" y="856" width="333" height="54" rx="9" fill="#ffffff" stroke="#2e7d4f" stroke-width="2"/>
  <text x="1010" y="890" font-size="20" fill="#1f2933" text-anchor="middle">requireRole</text>
  <rect x="1221" y="856" width="333" height="54" rx="9" fill="#ffffff" stroke="#2e7d4f" stroke-width="2"/>
  <text x="1387" y="890" font-size="20" fill="#1f2933" text-anchor="middle">input validation</text>
  <rect x="1598" y="856" width="333" height="54" rx="9" fill="#ffffff" stroke="#2e7d4f" stroke-width="2"/>
  <text x="1764" y="890" font-size="20" fill="#1f2933" text-anchor="middle">route handler + service</text>
  <rect x="1975" y="856" width="333" height="54" rx="9" fill="#ffffff" stroke="#2e7d4f" stroke-width="2"/>
  <text x="2141" y="890" font-size="20" fill="#1f2933" text-anchor="middle">audit write</text>
  <line x1="425" y1="883" x2="463" y2="883" stroke="#5b6672" stroke-width="2.5" marker-end="url(#arrow)"/>
  <line x1="802" y1="883" x2="840" y2="883" stroke="#5b6672" stroke-width="2.5" marker-end="url(#arrow)"/>
  <line x1="1179" y1="883" x2="1217" y2="883" stroke="#5b6672" stroke-width="2.5" marker-end="url(#arrow)"/>
  <line x1="1556" y1="883" x2="1594" y2="883" stroke="#5b6672" stroke-width="2.5" marker-end="url(#arrow)"/>
  <line x1="1933" y1="883" x2="1971" y2="883" stroke="#5b6672" stroke-width="2.5" marker-end="url(#arrow)"/>

  <!-- column A: routes -->
  <rect x="90" y="936" width="713" height="344" rx="11" fill="#ffffff" stroke="#2e7d4f" stroke-width="1.8"/>
  <text x="114" y="972" font-size="22" font-weight="bold" fill="#1f2933">Routes — src/routes</text>
  <line x1="114" y1="986" x2="779" y2="986" stroke="#2e7d4f" stroke-width="1" opacity="0.4"/>
  <text x="114" y="1018" font-size="19" fill="#1f2933">POST /api/auth/login · logout · GET /me</text>
  <text x="114" y="1050" font-size="19" fill="#1f2933">GET /api/students/me · /me/entries</text>
  <text x="114" y="1082" font-size="19" fill="#1f2933">POST /api/students/keys  — device enrolment</text>
  <text x="114" y="1114" font-size="19" font-weight="bold" fill="#1f2933">POST /api/challenge  — student, 20 / min</text>
  <text x="114" y="1146" font-size="19" font-weight="bold" fill="#1f2933">POST /api/verify  — guard, 60 / min</text>
  <text x="114" y="1178" font-size="19" fill="#1f2933">POST /api/overrides · /:id/decision (admin)</text>
  <text x="114" y="1210" font-size="19" fill="#1f2933">GET /api/admin/users · keys · audit · entries</text>
  <text x="114" y="1242" font-size="19" fill="#1f2933">POST /api/admin/keys/:id/revoke</text>
  <text x="114" y="1268" font-size="17" font-style="italic" fill="#2e7d4f">login limited to 5 / min per IP</text>

  <!-- column B: services -->
  <rect x="843" y="936" width="713" height="344" rx="11" fill="#ffffff" stroke="#2e7d4f" stroke-width="1.8"/>
  <text x="867" y="972" font-size="22" font-weight="bold" fill="#1f2933">Services — src/services</text>
  <line x1="867" y1="986" x2="1532" y2="986" stroke="#2e7d4f" stroke-width="1" opacity="0.4"/>
  <text x="867" y="1018" font-size="19" fill="#1f2933">challenge.js — issue nonce, 45 s TTL;</text>
  <text x="889" y="1046" font-size="19" fill="#1f2933">consumeNonce = conditional UPDATE</text>
  <text x="889" y="1074" font-size="19" font-weight="bold" fill="#b3261e">(the atomic anti-replay lock)</text>
  <text x="867" y="1108" font-size="19" fill="#1f2933">verification.js — parsePayload, verifyEntry,</text>
  <text x="889" y="1136" font-size="19" fill="#1f2933">reason codes, entry_events rows</text>
  <text x="867" y="1164" font-size="19" fill="#1f2933">keys.js — register / revoke, one active key</text>
  <text x="867" y="1190" font-size="19" fill="#1f2933">session.js · users.js · overrides.js</text>
  <text x="867" y="1216" font-size="19" fill="#1f2933">audit.js — append-only security log</text>
  <text x="867" y="1238" font-size="14" font-style="italic" fill="#2e7d4f">deny reason codes: MALFORMED_PAYLOAD · UNKNOWN_NONCE</text>
  <text x="867" y="1256" font-size="14" font-style="italic" fill="#2e7d4f">NONCE_REUSED · CHALLENGE_EXPIRED · IDENTITY_MISMATCH · KEY_REVOKED</text>
  <text x="867" y="1274" font-size="14" font-style="italic" fill="#2e7d4f">INVALID_SIGNATURE · UNREGISTERED_STUDENT · STUDENT_INACTIVE</text>

  <!-- column C: crypto -->
  <rect x="1596" y="936" width="713" height="344" rx="11" fill="#fdf1e3" stroke="#c9772a" stroke-width="1.8"/>
  <text x="1620" y="972" font-size="22" font-weight="bold" fill="#1f2933">Crypto core — src/crypto</text>
  <line x1="1620" y1="986" x2="2285" y2="986" stroke="#c9772a" stroke-width="1" opacity="0.5"/>
  <text x="1620" y="1018" font-size="19" fill="#1f2933">verify.js — canonicalMessage</text>
  <text x="1642" y="1046" font-size="19" font-family="DejaVu Sans Mono, monospace" fill="#8a4b12">v1|&lt;studentId&gt;|&lt;nonce&gt;|&lt;issuedAt&gt;</text>
  <text x="1642" y="1076" font-size="19" fill="#1f2933">crypto.verify(sha256, ECDSA,</text>
  <text x="1642" y="1104" font-size="19" font-family="DejaVu Sans Mono, monospace" fill="#8a4b12">dsaEncoding: 'ieee-p1363')</text>
  <text x="1620" y="1138" font-size="19" fill="#1f2933">nonce.js — 32 random bytes, base64url</text>
  <text x="1620" y="1170" font-size="19" fill="#1f2933">password.js — scrypt + timingSafeEqual</text>
  <text x="1620" y="1202" font-size="19" fill="#1f2933">keys.js — JWK validate / import / kid</text>
  <text x="1620" y="1240" font-size="19" font-weight="bold" fill="#b3261e">message rebuilt from the stored nonce row,</text>
  <text x="1620" y="1266" font-size="19" font-weight="bold" fill="#b3261e">never from the scanned payload</text>

  <!-- server to db -->
  <line x1="1200" y1="1302" x2="1200" y2="1366" stroke="#5b6672" stroke-width="3" marker-end="url(#arrow)" marker-start="url(#arrow)"/>
  <text x="1218" y="1342" font-size="19" fill="#3f4a56">synchronous queries + writes</text>

  <!-- ===== TIER 3: DATA ===== -->
  <text x="60" y="1354" font-size="18" font-weight="bold" fill="#8b95a1" letter-spacing="2">DATA TIER</text>
  <rect x="60" y="1368" width="2280" height="152" rx="14" fill="#f0eaf9" stroke="#6b4fa8" stroke-width="2.5"/>
  <text x="90" y="1408" font-size="24" font-weight="bold" fill="#1f2933">SQLite via node:sqlite — backend/data/sentryqr.db · foreign_keys ON · migrate.js + seed.js</text>

  <rect x="90" y="1428" width="260" height="70" rx="9" fill="#ffffff" stroke="#6b4fa8" stroke-width="1.8"/>
  <text x="220" y="1458" font-size="20" font-weight="bold" fill="#1f2933" text-anchor="middle">users</text>
  <text x="220" y="1482" font-size="16" fill="#5b6672" text-anchor="middle">scrypt hash + role</text>

  <rect x="370" y="1428" width="260" height="70" rx="9" fill="#ffffff" stroke="#6b4fa8" stroke-width="1.8"/>
  <text x="500" y="1458" font-size="20" font-weight="bold" fill="#1f2933" text-anchor="middle">students</text>
  <text x="500" y="1482" font-size="16" fill="#5b6672" text-anchor="middle">roll · room · block</text>

  <rect x="650" y="1428" width="260" height="70" rx="9" fill="#ffffff" stroke="#6b4fa8" stroke-width="1.8"/>
  <text x="780" y="1458" font-size="20" font-weight="bold" fill="#1f2933" text-anchor="middle">public_keys</text>
  <text x="780" y="1482" font-size="16" fill="#5b6672" text-anchor="middle">one active per student</text>

  <rect x="930" y="1428" width="260" height="70" rx="9" fill="#ffffff" stroke="#6b4fa8" stroke-width="1.8"/>
  <text x="1060" y="1458" font-size="20" font-weight="bold" fill="#1f2933" text-anchor="middle">nonces</text>
  <text x="1060" y="1482" font-size="16" fill="#5b6672" text-anchor="middle">issued → consumed</text>

  <rect x="1210" y="1428" width="260" height="70" rx="9" fill="#ffffff" stroke="#6b4fa8" stroke-width="1.8"/>
  <text x="1340" y="1458" font-size="20" font-weight="bold" fill="#1f2933" text-anchor="middle">auth_sessions</text>
  <text x="1340" y="1482" font-size="16" fill="#5b6672" text-anchor="middle">8 h, revocable</text>

  <rect x="1490" y="1428" width="260" height="70" rx="9" fill="#ffffff" stroke="#6b4fa8" stroke-width="1.8"/>
  <text x="1620" y="1458" font-size="20" font-weight="bold" fill="#1f2933" text-anchor="middle">entry_events</text>
  <text x="1620" y="1482" font-size="16" fill="#5b6672" text-anchor="middle">every gate decision</text>

  <rect x="1770" y="1428" width="260" height="70" rx="9" fill="#ffffff" stroke="#6b4fa8" stroke-width="1.8"/>
  <text x="1900" y="1458" font-size="20" font-weight="bold" fill="#1f2933" text-anchor="middle">audit_logs</text>
  <text x="1900" y="1482" font-size="16" fill="#5b6672" text-anchor="middle">append-only forensics</text>

  <rect x="2050" y="1428" width="260" height="70" rx="9" fill="#ffffff" stroke="#6b4fa8" stroke-width="1.8"/>
  <text x="2180" y="1458" font-size="20" font-weight="bold" fill="#1f2933" text-anchor="middle">override_requests</text>
  <text x="2180" y="1482" font-size="16" fill="#5b6672" text-anchor="middle">guard asks, admin decides</text>

  <!-- ===== SECURITY PROPERTIES ===== -->
  <text x="60" y="1568" font-size="18" font-weight="bold" fill="#8b95a1" letter-spacing="2">SECURITY PROPERTIES — what each mechanism buys</text>
  <rect x="60" y="1582" width="740" height="104" rx="11" fill="#ffffff" stroke="#b3261e" stroke-width="2"/>
  <text x="86" y="1616" font-size="22" font-weight="bold" fill="#b3261e">Freshness</text>
  <text x="86" y="1644" font-size="19" fill="#1f2933">server-issued 32-byte nonce, 45 s expiry, QR refresh 30 s</text>
  <text x="86" y="1670" font-size="19" font-style="italic" fill="#5b6672">defeats screenshot sharing and stale credentials</text>

  <rect x="830" y="1582" width="740" height="104" rx="11" fill="#ffffff" stroke="#b3261e" stroke-width="2"/>
  <text x="856" y="1616" font-size="22" font-weight="bold" fill="#b3261e">Single use</text>
  <text x="856" y="1644" font-size="19" fill="#1f2933">UPDATE nonces SET consumed WHERE status='issued'</text>
  <text x="856" y="1670" font-size="19" font-style="italic" fill="#5b6672">defeats replay, including two concurrent scans</text>

  <rect x="1600" y="1582" width="740" height="104" rx="11" fill="#ffffff" stroke="#b3261e" stroke-width="2"/>
  <text x="1626" y="1616" font-size="22" font-weight="bold" fill="#b3261e">Non-repudiation</text>
  <text x="1626" y="1644" font-size="19" fill="#1f2933">ECDSA P-256 signature by a non-extractable device key</text>
  <text x="1626" y="1670" font-size="19" font-style="italic" fill="#5b6672">defeats impersonation, forgery and key export</text>

  <!-- legend -->
  <line x1="60" y1="1706" x2="110" y2="1706" stroke="#5b6672" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="122" y="1712" font-size="18" fill="#3f4a56">HTTP request / response</text>
  <line x1="380" y1="1706" x2="430" y2="1706" stroke="#c9772a" stroke-width="3" stroke-dasharray="9 7" marker-end="url(#arrowOpt)"/>
  <text x="442" y="1712" font-size="18" fill="#3f4a56">optical QR transfer (camera reads screen)</text>
  <text x="960" y="1712" font-size="18" fill="#3f4a56">Trust: student device trusted · optical channel assumed public · guard device semi-trusted (displays, never decides) · server is the sole authority</text>
</svg>
